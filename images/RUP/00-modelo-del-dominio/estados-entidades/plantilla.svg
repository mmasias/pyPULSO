Borrador - -> Publicada : publicar [>= 1 pregunta]
Publicada : inmutable
Publicada - -> Archivada : archivar
Publicada - -> [*] : nueva versión\n(crea otra Plantilla en Borrador)
Archivada - -> [*] : nueva versión
@enduml

