[project]
name = "pypulso-backend"
version = "0.1.0"
description = "API FastAPI de pyPULSO -- gestor de encuestas docentes del ecosistema CELDA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Mismo techo que pyCelda: httpx 0.28 rompe starlette.testclient.
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
